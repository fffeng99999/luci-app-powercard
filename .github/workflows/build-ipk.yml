# Build luci-app-powercard .ipk with the official OpenWrt SDK containers.
# The package is architecture-independent (shell/JS/JSON, PKGARCH:=all),
# so the produced file is luci-app-powercard_<ver>_all.ipk and installs on
# ANY target (aarch64_cortex-a53 included). Two SDK releases are built to
# cover routers on 23.05 and 24.10 (both still use the opkg/ipk format).

name: Build ipk

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ipk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: SDK ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: aarch64_cortex-a53-23.05.6
            label: openwrt-23.05
          - sdk: aarch64_cortex-a53-24.10.8
            label: openwrt-24.10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build package with OpenWrt SDK
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.sdk }}
          PACKAGES: luci-app-powercard

      - name: Show built ipk
        run: find bin/packages/aarch64_cortex-a53 -name 'luci-app-powercard_*.ipk' -ls

      # Give each SDK product a distinct, readable name so both matrix
      # jobs can attach their file to the same GitHub Release.
      - name: Stage ipk
        env:
          LABEL: ${{ matrix.label }}
        run: |
          mkdir -p staged
          find bin/packages/aarch64_cortex-a53 -name 'luci-app-powercard_*.ipk' \
            -exec cp {} staged/luci-app-powercard_1.0.0_all_${LABEL}.ipk \;
          ls -l staged/

      - name: Upload ipk artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-powercard-a53-${{ matrix.label }}
          path: staged/*.ipk
          if-no-files-found: error

      # A tag push (e.g. git tag v1.0.0) also publishes the file on the
      # GitHub Release page. Both jobs upload their distinctly named file.
      - name: Publish release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: staged/*.ipk
          generate_release_notes: true
